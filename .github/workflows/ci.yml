name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests (Postgres service)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: integer
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: integer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U integer -d integer_test" --health-interval 2s --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://integer:ci-only-password@localhost:5432/integer_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy
      - run: pytest

  compose:
    name: docker compose up + all tests incl. e2e (4 workers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Start the stack
        run: docker compose up -d --build --wait
      - name: Run every test inside the compose network
        run: docker compose run --rm --build tests
      - name: Balance invariant holds on the live stack
        run: curl -fsS localhost:8000/health/invariants | tee /dev/stderr | grep -q '"balance_drift":0'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Stop
        if: always()
        run: docker compose down -v
