[alembic]
script_location = %(here)s/migrations
# Revisions are numbered by hand (0001, 0002, ...) so the order is obvious in the file list.
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os
# DATABASE_URL is read from the environment in migrations/env.py, never stored here.

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
