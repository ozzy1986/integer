# HTTP: only the ACME challenge for certbot and a redirect to HTTPS.
<VirtualHost *:80>
    ServerName integer.ozzy1986.com
    DocumentRoot /var/www/integer.ozzy1986.com/acme

    <Directory /var/www/integer.ozzy1986.com/acme>
        Require all granted
        Options -Indexes
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://integer.ozzy1986.com%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/integer.ozzy1986.com_error.log
    CustomLog ${APACHE_LOG_DIR}/integer.ozzy1986.com_access.log combined
</VirtualHost>
