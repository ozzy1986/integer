# HTTPS: everything goes to the docker compose stack on 127.0.0.1:8121 (the `app` service, 4 workers).
# Security headers and CSP are set by the application itself; Apache adds HSTS.
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName integer.ozzy1986.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/integer.ozzy1986.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/integer.ozzy1986.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    DocumentRoot /var/www/integer.ozzy1986.com/acme

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8121/ retry=0 timeout=70
    ProxyPassReverse / http://127.0.0.1:8121/
    RequestHeader set X-Forwarded-Proto "https"

    LimitRequestFields 50
    LimitRequestLine 8190

    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog ${APACHE_LOG_DIR}/integer.ozzy1986.com_error.log
    CustomLog ${APACHE_LOG_DIR}/integer.ozzy1986.com_access.log combined
</VirtualHost>
</IfModule>
